<h2 mat-dialog-title>Confirmar eliminación</h2>
<mat-dialog-content>
  ¿Estás seguro de que deseas eliminar esta reserva?
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button color="warn" [mat-dialog-close]="true" style="background: red; color: white;">Eliminar reserva</button>
  <button mat-button mat-dialog-close [mat-dialog-close]="false" style="background: red; color: white;">Cancelar</button>
</mat-dialog-actions>
