<div class="card-container">
    @for (item of turismo; track item.id) {
    <mat-card appearance="outlined">
        <img mat-card-image src={{item.imageUrl}}>
        <mat-card-content>
            <h3>{{item.name}}</h3>
            <p><b>Duracion:</b> {{item.duration}}</p>
            <p><b>Inicio:</b> {{item.inicio}} | {{item.retorno}}</p>
            <button mat-flat-button style="background: red; color: white;" [routerLink]="[item.id]">
                Mas Información
            </button>
        </mat-card-content>
    </mat-card>
}
</div>
<br><br>
